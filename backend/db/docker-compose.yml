services:
  postgres:
    image: postgres:16-alpine
    container_name: myleave-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: myleave
      POSTGRES_USER: myleave
      POSTGRES_PASSWORD: myleave123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myleave -d myleave"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
